# Luna Desktop Flatpak repo — Caddyfile for tunnel / HTTP mode
#
# Static files only: the OSTree repo, the installable bundles, and the
# .flatpakref / .flatpakrepo helper files, all written by watch.sh under
# /srv/luna-flatpak. Nothing outside the lists below is served (no staging
# files, no directory listings).
#
# Host: flatpak.luna.libreloom.org
# http:// so Caddy does not auto-HTTPS (TLS is at Cloudflare).
#
# Add the hostname as a public hostname on the server's cloudflared tunnel
# (service http://localhost:80). Include this file from /etc/caddy/Caddyfile:
#
#     import /opt/LibreServ/infra/flatpak-repo/Caddyfile.conf
#
# Cache rules: the files clients re-check on every update (summary, config,
# refs) stay fresh for a minute; objects, deltas and summaries are named by
# content hash and never change, so they cache forever. In Cloudflare add a
# Cache Rule for this hostname ("Eligible for cache", respect origin
# Cache-Control), because it skips extensionless and unusual file types.
#
# Loopback contract (do not relax):
#   Traffic arrives through the local cloudflared tunnel, so Caddy must listen
#   on loopback only. The server's /etc/caddy/Caddyfile must start with this
#   global block (once, shared with the Sol Connect and Luna Connect sites):
#
#     {
#         default_bind 127.0.0.1 [::1]
#     }
#
#   No remote_ip allowlist here: tunnel requests come from loopback, not from
#   Cloudflare edge addresses, so an allowlist would drop all traffic.

http://flatpak.luna.libreloom.org {
	root * /srv/luna-flatpak

	@fresh path /repo/summary /repo/summary.sig /repo/summary.idx* /repo/config /repo/refs/*
	@immutable path /repo/objects/* /repo/deltas/* /repo/delta-indexes/* /repo/summaries/*
	@bundle path /bundles/*.flatpak
	@ref path /*.flatpakref
	@repofile path /*.flatpakrepo

	header @fresh Cache-Control "public, max-age=60"
	header @immutable Cache-Control "public, max-age=31536000, immutable"
	header @bundle Cache-Control "public, max-age=60"
	header @bundle Content-Type application/vnd.flatpak
	header @ref Cache-Control "public, max-age=60"
	header @ref Content-Type application/vnd.flatpak.ref
	header @repofile Cache-Control "public, max-age=60"
	header @repofile Content-Type application/vnd.flatpak.repo

	# Only these paths are public; everything else is a plain 404.
	@public path /repo/summary /repo/summary.sig /repo/summary.idx* /repo/config /repo/refs/* /repo/objects/* /repo/deltas/* /repo/delta-indexes/* /repo/summaries/* /bundles/*.flatpak /*.flatpakref /*.flatpakrepo
	handle @public {
		file_server
	}
	handle {
		respond "Not found" 404
	}
}
