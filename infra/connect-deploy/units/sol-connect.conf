# shellcheck shell=bash disable=SC2034
# Per-unit settings for deploy.sh: Sol Connect. Sourced, not executed.

INSTALL_DIR="/opt/libreserv-connect"
CONFIG_DIR="/etc/libreserv-connect"
DATA_DIR="/var/lib/libreserv-connect"
BINARY_NAME="connect-server"
SERVICE_PREFIX="connect-"          # services: connect-a, connect-b
INSTANCES=("a:8091" "b:8092")      # name:port
HEALTH_PATH="/healthz"
DRAIN_STYLE="stop"                 # stop = systemctl stop + short wait; soft = drain file + Caddy grace
DRAIN_WAIT=2
SERVICE_USER="libreserv-connect"
KEY_NAME="libreserv.minisign.pub"  # in keys/ at the repo root
# --head: Sol deploys the current checkout as-is (no fetch, no reset).
HEAD_SYNC="current"
HEAD_CLEAN_PATH="sol/connect/web/"
# The web bundle must unpack to these entries (relative to the bundle root).
WEB_REQUIRE=("admin" "customer")

# Build from the checkout into $1: $1/server and $1/web/.
build_head() {
    local out="$1" commit when
    commit="$(git -C "$REPO_ROOT" rev-parse --short HEAD)"
    when="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    log_info "  Building admin UI..."
    (cd "$REPO_ROOT/sol/connect/web/admin" && npm install --silent && npm run build)
    log_info "  Building customer UI..."
    (cd "$REPO_ROOT/sol/connect/web/customer" && npm install --silent && npm run build)
    log_info "  Building connect-server..."
    (cd "$REPO_ROOT/sol/connect" && go build \
        -ldflags "-X main.version=$(git -C "$REPO_ROOT" describe --tags --always 2>/dev/null || echo dev) \
                  -X main.gitCommit=$commit \
                  -X main.buildTime=$when" \
        -o "$out/server" ./cmd/server)
    mkdir -p "$out/web/admin" "$out/web/customer"
    cp -a "$REPO_ROOT/sol/connect/web/admin/dist/." "$out/web/admin/"
    cp -a "$REPO_ROOT/sol/connect/web/customer/dist/." "$out/web/customer/"
}
