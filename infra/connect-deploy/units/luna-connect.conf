# shellcheck shell=bash disable=SC2034
# Per-unit settings for deploy.sh: Luna Connect. Sourced, not executed.

INSTALL_DIR="/opt/luna/connect"
CONFIG_DIR="/etc/luna/connect"
DATA_DIR="/var/lib/luna/connect"
BINARY_NAME="luna-connect"
SERVICE_PREFIX="luna-connect-"     # services: luna-connect-a, luna-connect-b
INSTANCES=("a:8101" "b:8102")      # name:port
HEALTH_PATH="/healthz"
# soft: touch $DATA_DIR/drain-<name> so /healthz answers 503, wait for Caddy to
# drop the instance, then stop it. Refuses to drain when the peer is unhealthy
# (unless --force).
DRAIN_STYLE="soft"
CADDY_DRAIN_GRACE=3                # must exceed Caddy health_interval x health_fails
SERVICE_USER="luna-connect"
KEY_NAME="lsluna.minisign.pub"
# --head: Luna hard-resets the checkout to origin/main first (--no-pull skips that).
HEAD_SYNC="origin-main"
# The web bundle's root is the web dir itself.
WEB_REQUIRE=("index.html")

# Build from the checkout into $1: $1/server and $1/web/.
build_head() {
    local out="$1" commit when
    commit="$(git -C "$REPO_ROOT" rev-parse --short HEAD)"
    when="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    log_info "  Building web UI..."
    (cd "$REPO_ROOT/luna/connect/web" && npm install --silent && npm run build)
    log_info "  Building luna-connect..."
    (cd "$REPO_ROOT/luna/connect" && go build \
        -ldflags "-X main.version=$(git -C "$REPO_ROOT" describe --tags --always 2>/dev/null || echo dev) \
                  -X main.gitCommit=$commit \
                  -X main.buildTime=$when" \
        -o "$out/server" ./cmd/server)
    mkdir -p "$out/web"
    cp -a "$REPO_ROOT/luna/connect/web/dist/." "$out/web/"
}
