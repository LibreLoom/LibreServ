# The bot overlay on the dsh-headless bundle.
# Keep real plugins. Exa is keyless web search (same as the host web profile).
# There is no review job type. The agent may call fj to set PR review state
# when the Owner asks. Keep real plugins (Exa).
#
# No dsh plugin auto-POSTs /pulls/.../reviews (searched dsh-headless, dsh-base,
# dsh-home settings/skills, @deepseek-ai plugins). Template PR reviews are
# the agent curling the API / following nightly. Do not add a github/forgejo
# review plugin. cook.sh sweeps bodies that start with
# "Automated review by The bot" during the cook.

- insert:
    - id: mcp-exa
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: exa
        transport: streamable-http
        url: https://mcp.exa.ai/mcp
        toolCallTimeoutMs: 60000
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10

# The bot memory-guard: prune tool-result content at append time to bound
# session-log memory growth. Uses STOCK tool-result-pruner thresholds
# (8192/4096/1024) so model input and prefix-cache keys are byte-identical to
# stock dsh — memory fix only, no behavior change. Heap watchdog + V8 backstop.
# Source: infra/agents/common/plugins/dsh-memory-guard (installed into the image's
# global dsh tree; cook.sh links it into this profile's node_modules).
- insert:
    - id: memory-guard
      name: dsh-memory-guard
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
        heapLimitMb: 2048
        intervalMs: 2000
        abortGraceMs: 2000
        verbose: false

# Mistral Vibe provider. Lives here, not in a settings.yaml: dsh imports a
# legacy settings.yaml only after the loader settles, so the first run in a fresh
# DSH_HOME resolved the stock deepseek-official route and died on
# MISSING_CREDENTIAL before the import landed. A patch entry is active from boot.
# API key: the MISTRAL_VIBE_API_KEY env var (from the bot's env_file), never
# stored. The headless bundle disables the credential store, so env is the only
# source.
#
# Model: deepseek-v4-1-flash-1017 only. The bots run exactly one model — cook.sh
# calls `dsh --profile headless` with no --model flag, so agent-default-model
# below is the sole selection and nothing iterates this list. Keeping it to one
# entry means the provider block cannot drift from what actually runs. Switching
# model is a deliberate edit here, not a menu choice.
#
# Cheap tier by default is a standing directive (2026-09-01). ai-proxy was torn
# down 2026-11-11; the bots now call Mistral directly.
#
# api: openai-responses, not openai-completions: Mistral's chat-completions
# stream sends reasoning as Mistral-native content arrays, which pi-ai's
# completions adapter rejects ("text-delta text must be a string"). Mistral also
# rejects role=developer on chat-completions. The Responses API handles both.
# Reasoning efforts: the values Mistral accepts for this model (probed
# 2026-11-11; it rejects minimal/medium with 400).
- id: llm-pi-ai
  config:
    providers:
      mistral-vibe:
        displayName: Mistral Vibe
        apiKeyEnv: MISTRAL_VIBE_API_KEY
        api: openai-responses
        baseURL: https://api.mistral.ai/v1
        models:
          - id: deepseek-v4-1-flash-1017
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              high: high
              xhigh: xhigh
              max: max

- id: agent-default-model
  config:
    provider: mistral-vibe
    model: deepseek-v4-1-flash-1017
    reasoningEffort: high

