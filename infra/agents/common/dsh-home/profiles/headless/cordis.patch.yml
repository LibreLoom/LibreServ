# The bot overlay on the dsh-headless bundle.
# Keep real plugins. Exa is keyless web search (same as the host web profile).
# There is no review job type. The agent may call fj to set PR review state
# when the Owner asks. Keep real plugins (Exa).
#
# No dsh plugin auto-POSTs /pulls/.../reviews (searched dsh-headless, dsh-base,
# dsh-home settings/skills, @deepseek-ai plugins). Template PR reviews are
# the agent curling the API / following nightly. Do not add a github/forgejo
# review plugin. cook.sh sweeps bodies that start with
# "Automated review by The bot" during the cook.

- insert:
    - id: mcp-exa
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: exa
        transport: streamable-http
        url: https://mcp.exa.ai/mcp
        toolCallTimeoutMs: 60000
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10

# The bot memory-guard: prune tool-result content at append time to bound
# session-log memory growth. Uses STOCK tool-result-pruner thresholds
# (8192/4096/1024) so model input and prefix-cache keys are byte-identical to
# stock dsh — memory fix only, no behavior change. Heap watchdog + V8 backstop.
# Source: infra/agents/common/plugins/dsh-memory-guard (installed into the image's
# global dsh tree; cook.sh links it into this profile's node_modules).
- insert:
    - id: memory-guard
      name: dsh-memory-guard
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
        heapLimitMb: 2048
        intervalMs: 2000
        abortGraceMs: 2000
        verbose: false

# ai-proxy provider. Lives here, not in a settings.yaml: dsh imports a
# legacy settings.yaml only after the loader settles, so the first run in a fresh
# DSH_HOME resolved the stock deepseek-official route and died on
# MISSING_CREDENTIAL before the import landed. A patch entry is active from boot.
# API key: the AI_PROXY_API_KEY env var (from the bot's env_file), never stored.
#
# Model: plainskill-flash only. The bots run exactly one model — cook.sh calls
# `dsh --profile headless` with no --model flag, so agent-default-model below is
# the sole selection and nothing iterates this list. Keeping it to one entry
# means the provider block cannot drift from what actually runs. Switching tier
# (coder = mid, ultra = best) is a deliberate edit here, not a menu choice.
#
# Cheap tier by default is a standing directive (2026-09-01): all three bots run
# plainskill-flash via ai-proxy. Tier aliases: flash = cheapest, coder = mid,
# ultra = best.
#
# Routing (2026-08-20): hyper primary (deepseek-v4-flash-0731) → airouter
# fallback. Hyper handles the nightly agent's subagent concurrency (4+
# parallel) — airouter's 3-parallel limit caused 429s that killed runs.
# Limits reflect hyper's capacity: 1048576 ctx / 384000 max tokens,
# reasoning levels none/low/medium/high/max/xhigh.
- id: llm-pi-ai
  config:
    providers:
      ai-proxy:
        displayName: ai-proxy
        apiKeyEnv: AI_PROXY_API_KEY
        api: openai-completions
        baseURL: https://ai.plainskill.net/v1
        models:
          - id: plainskill-flash
            contextWindow: 1048576
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
              xhigh: xhigh

- id: agent-default-model
  config:
    provider: ai-proxy
    model: plainskill-flash
    reasoningEffort: high

