# Luna Connect — Caddyfile for tunnel / HTTP mode
#
# TLS at Cloudflare's edge. Caddy load-balances two instances with
# active health checks so deploy.sh can soft-drain one at a time (ZDU).
#
# Host: connect.luna.libreloom.org
# http:// so Caddy does not auto-HTTPS (TLS is at Cloudflare).
#
# Timing contract with deploy.sh:
#   - Soft drain makes /healthz return 503 while the process still runs.
#   - health_interval + health_fails is how long Caddy takes to drop it.
#   - fail_duration enables passive checks so a dial error also drops it.
#
# Client-IP trust contract (do not relax):
#   The Go app trusts CF-Connecting-IP / X-Real-IP / X-Forwarded-For when
#   the upstream peer is loopback (this proxy). Those headers are only
#   honest if the request came through Cloudflare, so every request whose
#   remote IP is not a Cloudflare edge node is aborted below. Rate limits
#   and admin-IP gating depend on this — bypassing the edge must be
#   impossible. Keep the origin firewalled to Cloudflare too (the ranges
#   below are https://www.cloudflare.com/ips-v4 and ips-v6).

http://connect.luna.libreloom.org {
	@outside_cf not remote_ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
	abort @outside_cf

	reverse_proxy localhost:8101 localhost:8102 {
		health_uri /healthz
		health_interval 1s
		health_timeout 2s
		health_status 200
		health_fails 1
		fail_duration 5s
		lb_policy round_robin
	}
}
