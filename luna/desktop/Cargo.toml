[package]
name = "luna-desktop"
version = "0.1.0"
edition = "2024"
description = "Luna Desktop — backup and sync with GTK 4 + libadwaita"
license = "AGPL-3.0-or-later"

# Standalone crate (not part of the luna workspace — needs GTK/libadwaita).
[workspace]

[[bin]]
name = "luna-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
# Access token goes to the OS keychain (Secret Service / Keychain /
# Credential Manager) instead of plaintext session.json — best effort,
# with a 0600 file fallback for headless machines.
keyring = "4"
glib = "0.20"
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# Signed update feed rules + checked download (Windows self-update; the
# compatibility check is local). Path dependency; its Cargo.toml needs nothing
# from the luna workspace, so the Flatpak only has to copy that one crate.
luna-feed = { path = "../crates/luna-feed", features = ["download"] }

# StatusNotifierItem tray — Linux/BSD only (no D-Bus SNI host on macOS/Windows).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
semver = "1"

[dev-dependencies]
tempfile = "3"
