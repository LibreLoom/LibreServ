# Luna for Linux — Flatpak (Linux)

id: org.libreloom.LunaDesktop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: luna-desktop
# GNOME 51 sits on freedesktop 26.08; flatpak-builder picks the matching 26.08
# branch of the Rust extension on its own.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  # Only the portals the app actually uses: GTK 4's FileDialog talks to
  # FileChooser directly — the org.freedesktop.portal.Desktop umbrella would
  # grant every portal interface (screenshots, camera, location, …).
  - --talk-name=org.freedesktop.portal.FileChooser
modules:
  - name: luna-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # Cargo needs crates.io during the cut (sources are a dir, not cargo-vendor).
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/luna-desktop/cargo
    # The build tree mirrors the repo layout (luna/desktop, luna/crates/luna-feed,
    # keys/), because Cargo.toml and update.rs reach their neighbours by relative
    # path. Only the three pieces the app needs are copied, never all of luna/.
    build-commands:
      - cargo fetch --manifest-path luna/desktop/Cargo.toml
      - cargo build --release --manifest-path luna/desktop/Cargo.toml
      - install -Dm755 luna/desktop/target/release/luna-desktop /app/bin/luna-desktop
      - install -Dm644 luna/desktop/resources/org.libreloom.LunaDesktop.desktop /app/share/applications/org.libreloom.LunaDesktop.desktop
      - install -Dm644 luna/desktop/resources/icon.png /app/share/icons/hicolor/256x256/apps/org.libreloom.LunaDesktop.png
      - install -Dm644 luna/desktop/packaging/flatpak/org.libreloom.LunaDesktop.metainfo.xml /app/share/metainfo/org.libreloom.LunaDesktop.metainfo.xml
    sources:
      - type: dir
        path: ../..
        dest: luna/desktop
        skip:
          - target
          - release
          - node_modules
          - dist
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
          - packaging/flatpak/.flatpak-builder
      - type: dir
        path: ../../../crates/luna-feed
        dest: luna/crates/luna-feed
        skip:
          - target
      - type: file
        path: ../../../../keys/lsluna.minisign.pub
        dest: keys
