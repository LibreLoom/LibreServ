[package]
name = "lunad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Luna daemon: axum + SQLite + embedded web UI"
build = "build.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
blake3.workspace = true
axum.workspace = true
image.workspace = true
kamadak-exif.workspace = true
include_dir.workspace = true
jsonwebtoken.workspace = true
luna-core = { path = "../luna-core" }
luna-feed = { path = "../luna-feed" }
mime_guess.workspace = true
notify.workspace = true
rand_core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
minisign-verify.workspace = true
tokio.workspace = true
tower-http.workspace = true
tokio-util.workspace = true
tower.workspace = true
ureq.workspace = true
dav-server.workspace = true
bytes = "1"
libc = "0.2"
futures-util = "0.3"
getrandom.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
tempfile = "3"
lzma-rust2.workspace = true
semver.workspace = true
# Cloud backup crypto (backup/cloud/crypto.rs): key agreement, signatures, AEAD, KDF, recovery phrases.
bip39 = "3"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
semver.workspace = true

[[bin]]
name = "luna-console"
path = "src/bin/luna-console.rs"

[dev-dependencies]
minisign = "0.7"
# Statement tracing, to count database queries in a regression test.
rusqlite = { workspace = true, features = ["trace"] }
lzma-rust2 = { workspace = true, features = ["encoder"] }
