# Build the Luna Desktop .dmg on a GitHub-hosted Mac runner.
#
# Manual only — the real verification of a GTK app's macOS port is running it,
# so this produces a downloadable artifact rather than a release.
#
# Run: Actions → "Luna Desktop (macOS dmg)" → Run workflow.
name: Luna Desktop (macOS dmg)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture"
        type: choice
        options:
          - arm64
          - x86_64
          - both
        default: arm64
      version:
        description: "Version string for the .dmg name"
        required: false
        default: "0.0.21"

permissions:
  contents: read

jobs:
  dmg:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-13, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    # matrix covers both arches; the dispatch input picks which to run
    if: inputs.arch == 'both' || inputs.arch == matrix.arch
    env:
      LUNA_DESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK stack
        run: brew install gtk4 libadwaita pkgconf dylibbundler

      - name: Rust toolchain
        run: |
          rustup default stable
          rustc --version

      - name: Test (runs the macOS-gated LaunchAgent/session tests for real)
        run: cargo test
        working-directory: luna/desktop

      - name: Build .app + .dmg
        run: bash packaging/macos/build.sh
        working-directory: luna/desktop

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: luna-desktop-macos-${{ matrix.arch }}
          path: luna/desktop/release/*.dmg
          retention-days: 30
