server:
    address: ""
    port: 8080
    base_url: ""

database:
    url: "postgres://localhost:5432/libreserv_connect?sslmode=disable"

auth:
    device_token_secret: CHANGE_ME
    admin_token_secret: CHANGE_ME
    customer_token_secret: CHANGE_ME
    session_ttl_hours: 168

polar:
    enabled: false
    access_token: ""
    webhook_secret: ""
    sandbox: true
    product_free: ""
    product_lite: ""
    product_one: ""

smtp:
    host: smtp.libreloom.org
    port: 587
    username: ""
    password: ""
    from: noreply@libreloom.org
    use_tls: true

dns:
    provider: cloudflare
    api_token: ""
    zone: libreloom.org
    nameservers: []

inference:
    provider: neuralwatt
    base_url: https://inference.neuralwatt.dev/v1
    api_key: ""
    enabled: false

backup:
    provider: r2
    endpoint: ""
    access_key: ""
    secret_key: ""
    bucket_prefix: libreserv-backup

tunnel:
    provider: cloudflare
    api_token: ""
    account_id: ""

web:
    customer_dir: web/customer/dist
    admin_dir: web/admin/dist
