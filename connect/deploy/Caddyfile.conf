# LibreServ Connect — Caddyfile snippet for blue/green ZDU
#
# Add this to your Caddyfile (or import it). Caddy load-balances across
# two Connect instances with active health checks. When one instance
# is stopped during deploy, Caddy automatically routes all traffic to
# the other.
#
# Replace connect.example.com with your actual domain.

connect.example.com {
	reverse_proxy localhost:8091 localhost:8092 {
		# Active health check: Caddy probes this path every 2s.
		# If an instance fails, Caddy stops sending it traffic within 2s.
		health_uri /healthz
		health_interval 2s
		health_timeout 3s
		health_status 200

		# How long Caddy remembers a failed backend before retrying.
		fail_duration 5s

		# Round-robin between the two instances.
		lb_policy round_robin
	}
}
