# LibreServ Connect — Caddyfile for tunnel mode
#
# Caddy runs HTTP-only on port 80. TLS is handled at Cloudflare's edge
# by the tunnel + ACM wildcard certs. Caddy load-balances across two
# Connect instances with active health checks.

:80 {
	reverse_proxy localhost:8091 localhost:8092 {
		# Active health check: Caddy probes this path every 2s.
		# If an instance fails, Caddy stops sending it traffic within 2s.
		health_uri /healthz
		health_interval 2s
		health_timeout 3s
		health_status 200

		# How long Caddy remembers a failed backend before retrying.
		fail_duration 5s

		# Round-robin between the two instances.
		lb_policy round_robin
	}
}
