<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Admin</title>
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" id="favicon" />
    <script>
      (function(){try{var t=localStorage.getItem("connect-admin-theme");var isDark=false;if(t==="dark")isDark=true;else if(t==="system"||!t){if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)isDark=true;}var r=document.documentElement;if(isDark)r.classList.add("dark");}catch(e){}
try{var f=document.getElementById("favicon");if(f){f.href=(document.documentElement.classList.contains("dark"))?"/admin/favicon-dark.svg?v=4":"/admin/favicon.svg?v=4";}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
