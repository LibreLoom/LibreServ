# Sibling of atlas-bot. Uses the already-built atlas toolchain image.
# Look up the live image if this tag is missing:
#   docker inspect atlas-bot --format '{{.Config.Image}}'
# First `docker compose up` is from a host checkout of this file.
# After that the container force-pulls LibreServ into /data/LibreServ each run.
# Shell vars in command must be $$ so compose does not interpolate them on the host.
name: lock-bot
services:
  lock-bot:
    image: localhost/atlas-bot:latest
    container_name: lock-bot
    restart: unless-stopped
    user: "10000:10000"
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      set -euo pipefail;
      : "$${LOCK_BOT_TOKEN:?}";
      dest=/data/LibreServ;
      host="$${FORGEJO_URL:-https://gt.plainskill.net}";
      host="$${host#https://}"; host="$${host#http://}"; host="$${host%%/*}";
      if [ ! -d "$${dest}/.git" ]; then
        GIT_TERMINAL_PROMPT=0 git clone --depth 50
        "https://oauth2:$${LOCK_BOT_TOKEN}@$${host}/LibreLoom/LibreServ.git" "$${dest}";
      fi;
      git -C "$${dest}" fetch --depth 50 origin main;
      git -C "$${dest}" reset --hard origin/main;
      git -C "$${dest}" clean -fd;
      exec /bin/bash "$${dest}/agents/lock-bot/loop.sh"
    env_file:
      - /stack/compose/.secrets/lock-bot.env
    environment:
      FORGEJO_URL: https://gt.plainskill.net
      LOCK_ORG: LibreLoom
      LOCK_BOT_LOGIN: lock-bot
      BOT_REPO_DIR: /data/LibreServ
      TZ: America/Los_Angeles
      HOME: /home/atlas
    volumes:
      - lock-bot-data:/data
    networks:
      - proxy-net
volumes:
  lock-bot-data:
networks:
  proxy-net:
    external: true
