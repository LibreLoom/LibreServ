# Nightly agent patch layer over the dsh-headless bundle.
# The headless bundle ships the coding persona + tools; we add web search
# (Exa MCP, keyless) because the nightly prompt's dep-review step requires
# "search the web per candidate". The plugin resolves from the global dsh
# install (same mechanism as the host's web profile).

- insert:
    - id: mcp-exa
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: exa
        transport: streamable-http
        url: https://mcp.exa.ai/mcp
        toolCallTimeoutMs: 60000
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 10
