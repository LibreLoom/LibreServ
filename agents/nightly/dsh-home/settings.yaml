# dsh settings for the nightly agent (DSH_HOME=/opt/dsh).
# Mirrors the host's settings.yaml shape: `llm-pi-ai` provider section with
# apiKeyEnv (API key comes from the AI_PROXY_API_KEY env var, never stored),
# plus the default agent model used by the headless runner.

llm-pi-ai:
  providers:
    ai-proxy:
      displayName: ai-proxy
      apiKeyEnv: AI_PROXY_API_KEY
      api: openai-completions
      baseURL: https://ai.plainskill.net/v1
      models:
        - id: hyper-deepseek-v4-flash-0731
          contextWindow: 750000
          maxTokens: 384000
          reasoningEfforts:
            low: low
            high: high
            xhigh: xhigh
        - id: crof-deepseek-v4-flash-0731
          contextWindow: 750000
          maxTokens: 131072
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            max: max

agent-default-model:
  provider: ai-proxy
  model: hyper-deepseek-v4-flash-0731
  reasoningEffort: high

agent-presets:
  default: code
