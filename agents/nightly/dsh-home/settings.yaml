# dsh settings for the nightly agent (DSH_HOME=/opt/dsh).
# Mirrors the host's settings.yaml shape: `llm-pi-ai` provider section with
# apiKeyEnv (API key comes from the AI_PROXY_API_KEY env var, never stored),
# plus the default agent model used by the headless runner.
#
# Models: plainskill-coder (default agent model) and plainskill-flash.
# Both are OpenAI-compatible via ai-proxy (https://ai.plainskill.net/v1).
# Routing (2026-08-20): airouter primary (DeepSeek-V4-Flash) → hyper
# fallback. Limits reflect airouter's real capacity: 262144 ctx / 65536
# max tokens, reasoning levels none/low/medium/high/xhigh (no "max").
# dsh THINKING_LEVELS keys (off/low/medium/high/xhigh) map to wire values;
# "max" is NOT declared because airouter rejects it.

llm-pi-ai:
  providers:
    ai-proxy:
      displayName: ai-proxy
      apiKeyEnv: AI_PROXY_API_KEY
      api: openai-completions
      baseURL: https://ai.plainskill.net/v1
      models:
        - id: plainskill-coder
          contextWindow: 262144
          maxTokens: 65536
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        - id: plainskill-flash
          contextWindow: 262144
          maxTokens: 65536
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh

agent-default-model:
  provider: ai-proxy
  model: plainskill-coder
  reasoningEffort: high

agent-presets:
  default: code
