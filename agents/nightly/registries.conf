# Podman registry config for the nightly agent container.
# Required so `podman build` can resolve short image names (e.g.
# "golang:1.26-alpine") to docker.io. Without unqualified-search-registries,
# the podman-build CI test fails with "did not resolve to an alias and no
# unqualified-search registries are defined".
unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"
